name: Release Docker Image (GHCR)

# GHCR-only build for this fork. Push a numeric version tag, e.g.:
#   git tag v2.0.143.1 && git push origin v2.0.143.1
# Produces ghcr.io/<owner>/rdtclient:<version>, :latest and :sha-<short> for linux/amd64 and linux/arm64.

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  APP_NAME: rdtclient

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    strategy:
      matrix:
        config:
          - arch: amd64
            runs-on: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runs-on: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.config.runs-on }}
    outputs:
      digest-amd64: ${{ steps.digest.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.digest.outputs.digest-arm64 }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${APP_NAME}" >> "$GITHUB_ENV"

      - name: Extract version and patch .csproj
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s|<Version>.*</Version>|<Version>$VERSION</Version>|" server/RdtClient.Web/RdtClient.Web.csproj
          sed -i "s|<AssemblyVersion>.*</AssemblyVersion>|<AssemblyVersion>$VERSION</AssemblyVersion>|" server/RdtClient.Web/RdtClient.Web.csproj

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.config.platform }}
          build-args: |
            VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        id: digest
        run: echo "digest-${{ matrix.config.arch }}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  push-manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set image name and tags
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${APP_NAME}"
          TAGS="-t $IMAGE:sha-${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAGS="$TAGS -t $IMAGE:${GITHUB_REF_NAME#v} -t $IMAGE:latest"
          fi
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "TAGS=$TAGS" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create multi-arch manifest and push
        run: |
          docker buildx imagetools create $TAGS \
            "$IMAGE@${{ needs.build.outputs.digest-amd64 }}" \
            "$IMAGE@${{ needs.build.outputs.digest-arm64 }}"

      - name: Show result
        run: docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA::7}"
